<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Study Chronicle ✍️ | Handwritten Learning Platform</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Indie+Flower&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header Section -->
    <div class="header">
        <h1>📚 THE <span class="handwritten">STUDY</span> CHRONICLE</h1>
        <p>A Student Publication • Handwritten Edition • <span id="currentDate"></span></p>
        
        <!-- Study Tools Bar -->
        <div class="study-tools">
            <button class="tool-btn" onclick="toggleReadingMode()">✍️ Toggle Handwritten Mode</button>
            <button class="tool-btn" onclick="openCommonplaceBook()">📖 My Commonplace Book (<span id="clipCount">0</span>)</button>
            <button class="tool-btn" onclick="window.location.href='admin/'">🔐 Admin Login</button>
        </div>
        
        <!-- Study Streak Tracker -->
        <div class="streak-card">
            🔥 Study Streak: <span id="streakCount">0</span> days
            <button onclick="incrementStreak()" class="streak-btn">✅ Check-in Today</button>
        </div>
    </div>

    <!-- Main Content: Handwritten Newspaper -->
    <div class="newspaper-grid" id="contentGrid">
        <!-- Content loads dynamically from JSON -->
        <div class="loading">📖 Loading your handwritten notes...</div>
    </div>

    <!-- Quick Add Note Section (for logged-in users) -->
    <div class="quick-note" id="quickNote" style="display:none;">
        <h3>✍️ Quick Study Note</h3>
        <textarea id="quickNoteText" placeholder="Write a quick handwritten note..."></textarea>
        <button onclick="saveQuickNote()">💾 Save Note</button>
    </div>

    <script src="js/main.js"></script>
    <script src="js/commonplace.js"></script>
</body>
</html>
